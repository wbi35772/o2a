name: o2a

x-pool-build: &pool-build
  context: ../instacloud-warp
  args:
    APK_MIRROR_HOST: ${APK_MIRROR_HOST:-dl-cdn.alpinelinux.org}
    GOPROXY_URL: ${GOPROXY_URL:-https://proxy.golang.org,direct}
    SING_BOX_ARCH: ${SING_BOX_ARCH:-amd64}

services:
  # Chowns the bind-mounted pool volume before the pool starts. Without it the
  # image's unprivileged `warp` user cannot create /data/instances on a fresh
  # Docker-created directory.
  pool-init:
    profiles: ["core"]
    image: ${POOL_IMAGE:-o2a-warp-pool:local}
    pull_policy: never
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        chmod +x /usr/local/bin/entrypoint.sh /usr/local/bin/relay-entrypoint.sh /usr/local/bin/relay-watchdog.sh 2>/dev/null || true
        mkdir -p /data/instances /data/relay-root/relay
        chown -R warp:warp /data
    volumes:
      - ${DATA_ROOT:-./data}/pool:/data
    restart: "no"

  # WARP egress pool + sing-box relay supervisor in one container.
  # Host network is required: the gateway reaches 127.0.0.1:1081 and
  # 127.0.0.1:11081, and relay sessions bind 127.0.0.1:1594-1648.
  warp-pool:
    profiles: ["core"]
    build: *pool-build
    image: ${POOL_IMAGE:-o2a-warp-pool:local}
    container_name: o2a-warp-pool
    network_mode: host
    restart: unless-stopped
    init: true
    depends_on:
      pool-init:
        condition: service_completed_successfully
    environment:
      STATE_DIR: /data
      REGISTER_CHAIN_PORT: "1594"
      START_PORT: "${POOL_START_PORT:-1578}"
      POOL_SIZE: "${POOL_SIZE:-16}"
      INSTANCE_COUNT: "${POOL_SIZE:-16}"
      MUX_PORT: "1081"
      MUX_LISTEN: 0.0.0.0
      WIREPROXY_BIND_HOST: 0.0.0.0
      POOL_ID: "${POOL_ID:-local}"
      POOL_PUBLIC_HOST: "${POOL_PUBLIC_HOST:-127.0.0.1}"
      POOL_PRIVATE_HOST: "${POOL_PRIVATE_HOST:-127.0.0.1}"
      SOCKS_USER: "${SOCKS_USER:-warpuser}"
      SOCKS_PASS: "${SOCKS_PASS:?set SOCKS_PASS in deploy/.env}"
      API_TOKEN: "${POOL_API_TOKEN:-}"
      POOL_ADMIN_USER: "${POOL_ADMIN_USER:-admin}"
      POOL_ADMIN_PASSWORD: "${POOL_ADMIN_PASSWORD:-}"
      MIN_HEALTHY: "${MIN_HEALTHY:-14}"
      # Relay runs inside this container through relay-watchdog.sh.
      RELAY_STATE_DIR: /data/relay-root
      RELAY_MUX_PORT: "11081"
      SING_PORT_BASE: "${RELAY_PORT_BASE:-1594}"
      RELAY_COUNT: "${RELAY_COUNT:-}"
      RELAY_MAX_AUTO: "${RELAY_MAX_AUTO:-100}"
      RELAY_PRIVATE_HOST: "${RELAY_PRIVATE_HOST:-127.0.0.1}"
      RELAY_PUBLIC_HOST: "${RELAY_PUBLIC_HOST:-}"
      RELAY_SUB_URL: "${RELAY_SUB_URL:-}"
      RELAY_SYNC_INTERVAL: "${RELAY_SUB_SYNC_INTERVAL:-1800}"
      RELAY_PROBE_URL: "${RELAY_PROBE_URL:-https://[2606:4700:4700::1111]/cdn-cgi/trace}"
      RELAY_START_STAGGER: "${RELAY_START_STAGGER:-2.5}"
      RELAY_REFRESH_INTERVAL: "${RELAY_REFRESH_INTERVAL:-120}"
      RELAY_RECOVER_PER_ROUND: "${RELAY_RECOVER_PER_ROUND:-4}"
      RELAY_PROBE_TIMEOUT: "${RELAY_PROBE_TIMEOUT:-12}"
      RELAY_API_TOKEN: "${RELAY_API_TOKEN:-}"
      RELAY_PLAIN_WS: "${RELAY_PLAIN_WS:-0}"
      RELAY_NODE_HOST_OVERRIDE: "${RELAY_NODE_HOST_OVERRIDE:-}"
      RELAY_NODE_PORT_OVERRIDE: "${RELAY_NODE_PORT_OVERRIDE:-}"
      RELAY_WG_ENDPOINTS: "${RELAY_WG_ENDPOINTS:-}"
      BURNED_FILE: /shared/burned-prefix64.tsv
      REROLL_QUEUE: /shared/relay-reroll.queue
      API_ALLOW_ANON: "1"
      WG_ENDPOINT_HOST: "${WG_ENDPOINT_HOST:-162.159.192.1}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${DATA_ROOT:-./data}/pool:/data
      - ${DATA_ROOT:-./data}/shared:/shared
      - ${DATA_ROOT:-./data}/relay-nodes.tsv:/data/relay-root/relay/nodes.tsv:ro
      - ../instacloud-warp/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ../instacloud-warp/relay-entrypoint.sh:/usr/local/bin/relay-entrypoint.sh:ro
      - ../instacloud-warp/relay-watchdog.sh:/usr/local/bin/relay-watchdog.sh:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # OpenCode2API gateway. Host network so the pool/relay endpoints written as
  # 127.0.0.1 URLs resolve. The boot script seeds config.json from
  # config.seed.json on a fresh volume and keeps relay-egress.txt fresh.
  gateway:
    profiles: ["core"]
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-o2a-gateway:local}
    container_name: o2a-gateway
    network_mode: host
    restart: unless-stopped
    depends_on:
      warp-pool:
        condition: service_started
    entrypoint: ["/bin/sh", "/run/o2a/gateway-boot.sh"]
    environment:
      STATE_DIR: /var/lib/opencode2api
      CONFIG_PATH: /var/lib/opencode2api/config.json
      CONFIG_SEED_PATH: /run/o2a/config.seed.json
      EGRESS_FILE: /var/lib/opencode2api/egress-ext.txt
      POOL_SYNC_ENABLE: "1"
      POOL_API_URL: "http://127.0.0.1:1081"
      POOL_API_TOKEN: "${POOL_API_TOKEN:-}"
      POOL_SYNC_SCOPE: private
      POOL_SYNC_INTERVAL: "${POOL_SYNC_INTERVAL:-60}"
      RELAY_API_URL: "http://127.0.0.1:11081"
      RELAY_API_TOKEN: "${RELAY_API_TOKEN:-}"
      RELAY_EGRESS_INTERVAL: "${RELAY_EGRESS_INTERVAL:-60}"
      RELAY_PORT_COUNT: "${RELAY_COUNT:-24}"
      POOL_BURNED_FILE: /shared/burned-prefix64.tsv
      SOCKS_PASS: "${SOCKS_PASS:-}"
      ADMIN_PASS: "${ADMIN_PASS:-}"
      SERVER_KEY: "${SERVER_KEY:-}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${DATA_ROOT:-./data}/gateway:/var/lib/opencode2api
      - ./config.seed.json:/run/o2a/config.seed.json:ro
      - ./gateway-boot.sh:/run/o2a/gateway-boot.sh:ro
      - ../pool-sync.sh:/usr/local/bin/pool-sync.sh:ro
      - ${DATA_ROOT:-./data}/shared:/shared
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Xray VLESS+WS node. Run on edge machines with --profile edge.
  # TLS is normally terminated by the platform ingress or a reverse proxy;
  # set EDGE_PUBLIC_TLS=0 and EDGE_PUBLIC_PORT=<published port> for plain HTTP.
  xray-node:
    profiles: ["edge"]
    build:
      context: ../net/xray-ws-node
    image: ${NODE_IMAGE:-o2a-xray-node:local}
    container_name: o2a-xray-node
    restart: unless-stopped
    environment:
      PORT: "${EDGE_NODE_PORT:-8443}"
      XRAY_PORT: "8081"
      WS_PATH: "${EDGE_WS_PATH:-/proxy}"
      STATE_DIR: /data
      UUID: "${EDGE_UUID:-}"
      PUBLIC_PORT: "${EDGE_PUBLIC_PORT:-443}"
      PUBLIC_TLS: "${EDGE_PUBLIC_TLS:-1}"
      TZ: "${TZ:-UTC}"
      SOCKS_ENABLED: "1"
      SOCKS_PORT: "${EDGE_SOCKS_PORT:-11080}"
      SOCKS_LISTEN: "0.0.0.0"
      SUB_TOKEN: "${EDGE_SUB_TOKEN:-}"
      SOCKS_USER: "${EDGE_SOCKS_USER:-o2a}"
      SOCKS_PASS: "${EDGE_SOCKS_PASS:-}"
    ports:
      - "${EDGE_PORT:-8443}:${EDGE_NODE_PORT:-8443}"
      - "127.0.0.1:${EDGE_SOCKS_PORT:-11080}:${EDGE_SOCKS_PORT:-11080}"
    volumes:
      - ${DATA_ROOT:-./data}/node:/data
    security_opt:
      - no-new-privileges:true

  # Endpoint checker: /healthz, /api/check, JSONL log in /data.
  checker:
    profiles: ["tools"]
    build:
      context: ../net/checker
    image: ${CHECKER_IMAGE:-o2a-checker:local}
    container_name: o2a-checker
    restart: unless-stopped
    environment:
      LISTEN: ":8199"
      STATE_DIR: /data
      MAX_BATCH: "${CHECKER_MAX_BATCH:-64}"
      DEFAULT_TIMEOUT_MS: "${CHECKER_TIMEOUT_MS:-5000}"
      CHECKER_TOKEN: "${CHECKER_TOKEN:-}"
      TZ: "${TZ:-UTC}"
    ports:
      - "${CHECKER_PORT:-8199}:8199"
    volumes:
      - ${DATA_ROOT:-./data}/checker:/data
    security_opt:
      - no-new-privileges:true
