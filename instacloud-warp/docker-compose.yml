services:
  warp-pool-producer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APK_MIRROR_HOST: "${APK_MIRROR_HOST:-dl-cdn.alpinelinux.org}"
        GOPROXY_URL: "${GOPROXY_URL:-https://proxy.golang.org,direct}"
    image: warp-pool-producer:1.0.0
    container_name: warp-pool-producer
    restart: unless-stopped
    # Host networking keeps the SOCKS5 ports on the node's INPUT path, so the
    # center-IP whitelist (scripts/firewall-allow-center.sh) is actually enforced.
    network_mode: host
    environment:
      EXTERNAL_HOST: "${EXTERNAL_HOST:-}"
      SOCKS_USER: "${SOCKS_USER:-warpuser}"
      SOCKS_PASS: "${SOCKS_PASS:-WarpPass2026}"
      INSTANCE_COUNT: "${INSTANCE_COUNT:-16}"
      POOL_SIZE: "${POOL_SIZE:-16}"
      START_PORT: "${START_PORT:-1081}"
      REROLL_INTERVAL: "${REROLL_INTERVAL:-900}"
      REROLL_BATCH: "${REROLL_BATCH:-4}"
      DEDUP_RETRIES: "${DEDUP_RETRIES:-4}"
      REGISTER_RETRIES: "${REGISTER_RETRIES:-3}"
      WGCF_KEEPALIVE: "${WGCF_KEEPALIVE:-25}"
      DENY_48_PREFIXES: "${DENY_48_PREFIXES:-2a09:bac5:55 2a09:bac1:65 2a09:bac5:c82 2a09:bac1:27b 2a09:bac1:1e}"
      PROBE_URL: "${PROBE_URL:-https://opencode.ai/cdn-cgi/trace}"
      PROBE_TIMEOUT: "${PROBE_TIMEOUT:-6}"
      HEALTH_INTERVAL: "${HEALTH_INTERVAL:-300}"
    volumes:
      - warp-pool-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  warp-pool-data:
