# Example topology for the net group. Copy next to your own .env and adjust.
# On a plain Docker host this replaces the InstaCloud per-service proxy:
# each service is just a container port.

services:
  node-sg-ws:
    build:
      context: ./xray-ws-node
    image: xray-ws-node:2.0.0
    restart: unless-stopped
    environment:
      PORT: "8080"
      XRAY_PORT: "8081"
      WS_PATH: /proxy
      STATE_DIR: /data
      PUBLIC_PORT: "443"
      PUBLIC_TLS: "1"
    ports:
      - "8080:8080"
    volumes:
      - node-sg-ws-data:/data

  node-us:
    build:
      context: ./xray-ws-node
    image: xray-ws-node:2.0.0
    restart: unless-stopped
    environment:
      PORT: "8443"
      STATE_DIR: /data
      PUBLIC_PORT: "443"
      PUBLIC_TLS: "1"
    ports:
      - "8443:8443"
    volumes:
      - node-us-data:/data

  checker:
    build:
      context: ./checker
    image: o2a-checker:1.0.0
    restart: unless-stopped
    environment:
      LISTEN: ":8199"
      STATE_DIR: /data
      MAX_BATCH: "64"
      DEFAULT_TIMEOUT_MS: "5000"
      # CHECKER_TOKEN: change-me
    ports:
      - "8199:8199"
    volumes:
      - checker-data:/data

volumes:
  node-sg-ws-data:
  node-us-data:
  checker-data:
